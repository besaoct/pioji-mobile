<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Samples</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button,input{font:inherit;color:inherit;border:0;outline:none;background:none;-webkit-tap-highlight-color:transparent}
a{color:#1F5A43;text-decoration:none}a:hover{color:#1F5A43}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F0F3F1; color: #121815; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, Roboto, sans-serif">
<div style="box-sizing: border-box; padding: 58px 16px 120px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: flex-end; align-items: center; gap: 4px">
<a href="Samples.dc.html" style="font-size: 16px; padding: 8px 10px">Batches</a>
<a href="NewSample.dc.html" aria-label="New sample" style="width: 36px; height: 36px; border-radius: 18px; background: #1F5A43; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.4px">Samples</h1>
<label style="height: 40px; border-radius: 11px; background: rgba(118,128,121,.12); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #6B756F">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
<input type="search" placeholder="Search garden, grade or invoice" aria-label="Search samples" style="flex-grow: 1; font-size: 16px; padding: 0">
</label>
<div style="display: flex; gap: 8px; overflow: hidden">
<button type="button" style="height: 34px; padding: 0 14px; border-radius: 17px; background: #1F5A43; color: #FFFFFF; font-size: 14px; white-space: nowrap">All</button>
<button type="button" style="height: 34px; padding: 0 14px; border-radius: 17px; background: #FFFFFF; color: #4F5853; font-size: 14px; white-space: nowrap">Received</button>
<button type="button" style="height: 34px; padding: 0 14px; border-radius: 17px; background: #FFFFFF; color: #4F5853; font-size: 14px; white-space: nowrap">Pending evaluation</button>
<button type="button" style="height: 34px; padding: 0 14px; border-radius: 17px; background: #FFFFFF; color: #4F5853; font-size: 14px; white-space: nowrap">Evaluated</button>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<span style="height: 30px; padding: 0 6px 0 12px; border-radius: 9px; background: rgba(31,90,67,.08); color: #1F5A43; font-size: 13px; display: flex; align-items: center; gap: 4px">Arrival: 17 Oct 2026
<button type="button" aria-label="Remove filter" style="width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; color: #1F5A43"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></span>
<button type="button" style="height: 30px; padding: 0 10px; font-size: 13px; color: #1F5A43">Filters</button>
<span style="flex-grow: 1"></span>
<span style="font-size: 13px; color: #6B756F">48 samples</span>
</div>
<div style="background: #FFFFFF; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 16px rgba(0,0,0,.035); overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
<div style="{{r.sepStyle}}"></div>
<a href="NewSample.dc.html" style="min-height: 64px; padding: 10px 14px; box-sizing: border-box; display: flex; align-items: center; gap: 10px; color: #121815">
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 16px; font-weight: 500">{{r.title}}</span>
<span style="font-size: 13px; color: #6B756F">{{r.sub}}</span>
</span>
<span style="display: flex; flex-direction: column; align-items: flex-end; gap: 4px; flex-shrink: 0">
<span style="font-size: 15px; font-variant-numeric: tabular-nums">{{r.kg}}</span>
<span style="font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 6px; {{r.badgeStyle}}">{{r.status}}</span>
</span>
</a>
</sc-for>
</div>
</div>
<div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 142px">
<dc-import name="TabBar" active="samples" dark="{{no}}" hint-size="390px,142px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const badge = {
Received: 'color: #2E7D4F; background: rgba(46,125,79,.12)',
'Pending evaluation': 'color: #9A6200; background: rgba(154,98,0,.12)',
Evaluated: 'color: #1F5A43; background: rgba(31,90,67,.08)',
Approved: 'color: #2E7D4F; background: rgba(46,125,79,.12)'
};
const data = [
['Assam Valley · BOP', 'SMP 2048 · 15 × 40 kg', '600 kg', 'Received'],
['Halmari · BP', 'SMP 2051 · 20 × 35 kg', '700 kg', 'Pending evaluation'],
['Jaipur · OF', 'SMP 2055 · 12 × 30 kg', '360 kg', 'Evaluated'],
['Assam Valley · BOPSM', 'SMP 2060 · 18 × 38 kg', '684 kg', 'Received'],
['Mangalam · PD', 'SMP 2064 · 25 × 40 kg', '1,000 kg', 'Approved'],
['Halmari · BOP', 'SMP 2069 · 10 × 36 kg', '360 kg', 'Pending evaluation']
];
const rows = data.map((d, i) => ({
title: d[0], sub: d[1], kg: d[2], status: d[3], badgeStyle: badge[d[3]],
sepStyle: i ? 'height: 0.5px; background: #E2E7E4; margin-left: 14px' : 'display: none'
}));
return { rows, no: false };
}
}
</script>
</body>
</html>
