<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bid book</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
button,input{font:inherit;color:inherit;border:0;outline:none;background:none;-webkit-tap-highlight-color:transparent}
a{color:#1F5A43;text-decoration:none}a:hover{color:#1F5A43}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #F0F3F1; color: #121815; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, Roboto, sans-serif">
<div style="box-sizing: border-box; padding: 58px 16px 120px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: flex-end; align-items: center">
<a href="BidBook.dc.html" aria-label="New lot" style="width: 36px; height: 36px; border-radius: 18px; background: #1F5A43; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
</div>
<h1 style="margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.4px">Bid book</h1>
<div role="tablist" aria-label="Bid book views" style="display: flex; background: rgba(118,128,121,.12); border-radius: 10px; padding: 2px">
<button type="button" role="tab" aria-selected="false" style="flex-grow: 1; height: 32px; border-radius: 8px; font-size: 13px; color: #4F5853">All</button>
<button type="button" role="tab" aria-selected="true" style="flex-grow: 1; height: 32px; border-radius: 8px; font-size: 13px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(0,0,0,.08)">Open</button>
<button type="button" role="tab" aria-selected="false" style="flex-grow: 1; height: 32px; border-radius: 8px; font-size: 13px; color: #4F5853">Parked</button>
<button type="button" role="tab" aria-selected="false" style="flex-grow: 1; height: 32px; border-radius: 8px; font-size: 13px; color: #4F5853">Held</button>
<button type="button" role="tab" aria-selected="false" style="flex-grow: 1; height: 32px; border-radius: 8px; font-size: 13px; color: #4F5853">Awaiting</button>
</div>
<label style="height: 40px; border-radius: 11px; background: rgba(118,128,121,.12); display: flex; align-items: center; gap: 8px; padding: 0 12px; color: #6B756F">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg>
<input type="search" placeholder="Search invoice, garden or buyer" aria-label="Search bid book" style="flex-grow: 1; font-size: 16px; padding: 0">
</label>
<sc-for list="{{lots}}" as="l" hint-placeholder-count="4">
<a href="BidBook.dc.html" style="background: #FFFFFF; border-radius: 14px; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 16px rgba(0,0,0,.035); padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; color: #121815">
<span style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px">
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
<span style="font-size: 16px; font-weight: 500">{{l.title}}</span>
<span style="font-size: 13px; color: #6B756F">{{l.sub}}</span>
</span>
<span style="font-size: 12px; font-weight: 500; padding: 2px 8px; border-radius: 6px; flex-shrink: 0; {{l.badgeStyle}}">{{l.status}}</span>
</span>
<span style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; color: #6B756F">Incoming</span><span style="font-size: 15px; font-variant-numeric: tabular-nums">{{l.inc}}</span></span>
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; color: #6B756F">Max bid</span><span style="font-size: 15px; font-variant-numeric: tabular-nums">{{l.max}}</span></span>
<span style="display: flex; flex-direction: column; gap: 1px"><span style="font-size: 12px; color: #6B756F">Negotiated</span><span style="font-size: 15px; font-weight: 600; color: #1F5A43; font-variant-numeric: tabular-nums">{{l.neg}}</span></span>
</span>
<span style="height: 0.5px; background: #E2E7E4"></span>
<span style="display: flex; justify-content: space-between; font-size: 13px">
<span style="{{l.buyerStyle}}">{{l.buyer}}</span>
<span style="color: #6B756F">{{l.who}}</span>
</span>
</a>
</sc-for>
</div>
<div style="position: absolute; left: 0; bottom: 0; width: 390px; height: 142px">
<dc-import name="TabBar" active="bids" dark="{{no}}" hint-size="390px,142px"></dc-import>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const open = 'color: #1F5A43; background: rgba(31,90,67,.08)';
const lots = [
{ title: 'Assam Valley · BP', sub: 'INV-BB-891 · 30 pkgs · 1,050 kg', status: 'Open', badgeStyle: open, inc: '₹270.00', max: '₹290.00', neg: '₹285.00', buyer: 'Tata Tea', buyerStyle: 'color: #4F5853', who: 'Negotiator: R. Das' },
{ title: 'Halmari · BOP', sub: 'INV-BB-902 · 24 pkgs · 840 kg', status: 'Open', badgeStyle: open, inc: '₹305.00', max: '₹320.00', neg: '₹312.00', buyer: 'Unallocated', buyerStyle: 'color: #9A6200; font-weight: 500', who: 'Negotiator: S. Roy' },
{ title: 'Jaipur · OF', sub: 'INV-BB-915 · 18 pkgs · 540 kg', status: 'Open', badgeStyle: open, inc: '₹240.00', max: '₹255.00', neg: '₹250.00', buyer: 'Wagh Bakri', buyerStyle: 'color: #4F5853', who: 'Negotiator: R. Das' }
];
return { lots, no: false };
}
}
</script>
</body>
</html>
