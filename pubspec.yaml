name: tea_erp
description: "Tea ERP mobile app (Pioji) for iOS and Android."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.2
  cupertino_icons: ^2.0.0
  device_info_plus: ^13.3.0
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.1
  image_picker: ^1.2.4
  intl: ^0.20.2
  mobile_scanner: ^7.4.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
flutter:
  uses-material-design: true

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#F0F3F1"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  adaptive_icon_monochrome: assets/icon/icon_monochrome.png
  image_path_ios_dark_transparent: assets/icon/icon_dark_transparent.png
  min_sdk_android: 21

flutter_native_splash:
  color: "#F0F3F1"
  color_dark: "#0A0D0B"
  image: assets/icon/splash.png
  android_12:
    color: "#F0F3F1"
    color_dark: "#0A0D0B"
    image: assets/icon/icon_foreground.png
